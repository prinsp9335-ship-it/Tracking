<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
#map { height: 100vh; }
</style>

</head>

<body>

<div id="map"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  databaseURL: "https://outlettracking-53331-default-rtdb.firebaseio.com",
  projectId: "outlettracking-53331"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// map init
const map = L.map('map').setView([28.6, 77.2], 12);

// free tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

const markers = {};

onValue(ref(db, "employees"), (snapshot) => {

  const data = snapshot.val();

  for (let id in data) {

    if (!data[id].lat) continue;

    const lat = data[id].lat;
    const lon = data[id].lon;

    if (markers[id]) {
      markers[id].setLatLng([lat, lon]);
    } else {
      markers[id] = L.marker([lat, lon])
        .addTo(map)
        .bindPopup("Employee: " + id);
    }

  }

});

</script>

</body>
</html>
