<!DOCTYPE html>
<html>
<body>

<h2>Employee Live Tracker</h2>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOwJ1_MJsK_Ye7mhhMRlimQQ31LfGd7UY",
  databaseURL: "https://outlettracking-25495-default-rtdb.firebaseio.com",
  projectId: "outlettracking-25495"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const empId = prompt("Enter ID");

if (!empId) {
  alert("Enter ID first");
} else {

  navigator.geolocation.watchPosition(
    (pos) => {

      set(ref(db, "employees/" + empId), {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        time: Date.now()
      });

    },
    (err) => {
      alert("Location error: " + err.message);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 5000
    }
  );

}

</script>

</body>
</html>
