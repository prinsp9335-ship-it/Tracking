<!DOCTYPE html>
<html>
<body>

<h2>Employee Live Tracker</h2>

<!-- 🔒 Force ID Popup -->
<div id="idBox" style="
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.7);display:flex;
align-items:center;justify-content:center;z-index:9999;">

  <div style="background:#fff;padding:20px;border-radius:8px;text-align:center;">
    <h3>Enter Employee ID</h3>
    <input id="empInput" type="text" placeholder="Enter ID"><br><br>
    <button onclick="submitId()">Start</button>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOwJ1_MJsK_Ye7mhhMRlimQQ31LfGd7UY",
  databaseURL: "https://outlettracking-25495-default-rtdb.firebaseio.com",
  projectId: "outlettracking-25495"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let empId = "";

// ✅ Submit ID
window.submitId = function() {

  const val = document.getElementById("empInput").value.trim();

  if (!val) {
    alert("ID डालना जरूरी है!");
    return;
  }

  empId = val;

  document.getElementById("idBox").style.display = "none";

  startTracking();
};

// 📍 Start Tracking
function startTracking() {

  navigator.geolocation.watchPosition(
    (pos) => {

      set(ref(db, "employees/" + empId), {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        time: Date.now()
      });

    },
    (err) => {
      alert("Location error: " + err.message);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 5000
    }
  );

}

</script>

</body>
</html>
